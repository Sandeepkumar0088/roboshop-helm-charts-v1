apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq-dev.sandeepkumar0088.online"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    project: roboshop
    app: payment
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    project: roboshop
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      app: payment
  template:
    metadata:
      labels:
        project: roboshop
        app: payment
    spec:
      containers:
        - name: payment
          image: 389841108590.dkr.ecr.us-east-1.amazonaws.com/payment
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 1
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 10
            periodSeconds: 10
#          resources:
#            limits:
#              cpu: "200m"
#              memory: "512Mi"
#            requests:
#              cpu: "200m"
#              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: payment
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60