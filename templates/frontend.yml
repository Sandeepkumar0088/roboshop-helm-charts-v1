apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
data:
  CATALOGUE_HOST : "catalogue"
  CATALOGUE_PORT : "8080"
  USER_HOST      : "user"
  USER_PORT      : "8080"
  CART_HOST      : "cart"
  CART_PORT      : "8080"
  SHIPPING_HOST  : "shipping"
  SHIPPING_PORT  : "8080"
  PAYMENT_HOST   : "payment"
  PAYMENT_PORT   : "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
#  type: LoadBalancer
  selector:
    project: roboshop
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: default
    - port: 9113
      targetPort: 9113
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    project: roboshop
    app: frontend
spec:
  replicas: 2
#  strategy:
#    rollingUpdate:
#      maxUnavailable: 0
#      maxSurge: 1
#    type: RollingUpdate
  selector:
    matchLabels:
      project: roboshop
      app: frontend
  template:
    metadata:
      labels:
        project: roboshop
        app: frontend
    spec:
      containers:
        - args:
            - -nginx.scrape-uri=http://127.0.0.1/health
          image: nginx/nginx-prometheus-exporter:latest
          name: exporter
          ports:
            - containerPort: 9113
              name: metrics

        - name: frontend
          image: 389841108590.dkr.ecr.us-east-1.amazonaws.com/frontend
          imagePullPolicy: Always
#          lifecycle:
#            preStop:
#              exec:
#                command: [ "/bin/sh", "-c", "sleep 30" ]
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 1
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 9113
              name: default
          envFrom:
            - configMapRef:
                name: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  ingressClassName: nginx
  rules:
    - host: "frontend-dev.sandeepkumar0088.online"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50