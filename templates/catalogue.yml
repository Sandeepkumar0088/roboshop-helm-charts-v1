apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
data:
  MONGO       : "true"
  MONGO_URL   : "mongodb://mongodb-dev.sandeepkumar0088.online:27017/catalogue"
  DB_TYPE     : "mongo"
  APP_GIT_URL : "https://github.com/roboshop-devops-project-v3/catalogue"
  DB_HOST     : "mongodb-dev.sandeepkumar0088.online"
  SCHEMA_FILE : "db/master-data.js"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
spec:
  selector:
    project: roboshop
    app: catalogue
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  labels:
    project: roboshop
    app: catalogue
spec:
  replicas: 2
#  strategy:
#    rollingUpdate:
#      maxUnavailable: 0
#      maxSurge: 1
#    type: RollingUpdate
  selector:
    matchLabels:
      project: roboshop
      app: catalogue
  template:
    metadata:
      labels:
        project: roboshop
        app: catalogue
    spec:
      containers:
        - name: catalogue
          image: 389841108590.dkr.ecr.us-east-1.amazonaws.com/catalogue
          imagePullPolicy: Always
#          lifecycle:
#            preStop:
#              exec:
#                command: [ "/bin/sh", "-c", "sleep 30" ]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 1
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 10
            periodSeconds: 10
#          resources:
#            limits:
#              cpu: "100m"
#              memory: "128Mi"
#            requests:
#              cpu: "100m"
#              memory: "128Mi"
          envFrom:
            - configMapRef:
                name: catalogue
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalogue-schema
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: schema
          image: public.ecr.aws/w8x4g9h7/roboshop-v3/schema-load
          env:
            - name: SCHEMA_FILE
              value: db/master-data.js
          envFrom:
            - configMapRef:
                name: catalogue
      restartPolicy: Never
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50