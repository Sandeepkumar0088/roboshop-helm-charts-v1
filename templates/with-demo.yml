apiVersion: v1
kind: configMap
metadata:
  name: {{  .Release.Name  }}-config-0
data:
  myValue: "hello world"
  drink: {{.Values.favorite.drink}}
  food: {{.Values.favorite.food}}
---
apiVersion: v1
kind: configMap
metadata:
  name: {{  .Release.Name  }}-config-1
data:
  myValue: "hello world"
    {{- with  .Values.favorite  }}
    drink: {{  .drink | default tea | quote }}
    food: {{ .food | upper | quote  }}
    release: {{  $.Release.Name  }}
    {{- end  }}